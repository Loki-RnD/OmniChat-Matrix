name: omnichat-matrix-prototype
services:
    synapse:
        image: ghcr.io/element-hq/synapse:v1.161.0
        environment:
            SYNAPSE_SERVER_NAME: omnichat.local
            SYNAPSE_REPORT_STATS: 'no'
        ports:
            - '127.0.0.1:8010:8008'
        volumes:
            - './.state/synapse:/data'
        restart: 'no'
